name: Production CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual "Run workflow" button in GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Test, Lint & Build
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            dist
            Dockerfile.dist
            nginx.conf
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Production VPS
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    environment:
      name: production
      url: https://vegbazar.store

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: deploy-pkg/

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS over SSH
        env:
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USERNAME }}
          RAW_TARGET: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          # Sanitize inputs (strip trailing spaces, newlines, and http(s):// prefixes)
          HOST=$(echo "$RAW_HOST" | tr -d '\r\n\t ' | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||')
          USER=$(echo "$RAW_USER" | tr -d '\r\n\t ')
          TARGET=$(echo "$RAW_TARGET" | tr -d '\r\n\t ')

          echo "Deploying to $USER@$HOST:$TARGET ..."

          # Sync dist and container files to VPS
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            deploy-pkg/ "$USER@$HOST:$TARGET"

          # Deploy container or reload native nginx
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash -s << EOF
            set -e
            cd "$TARGET"
            if command -v docker >/dev/null 2>&1; then
              echo "Building & running lightweight frontend container..."
              docker build -f Dockerfile.dist -t vegbazar-frontend:latest .
              docker stop vegbazar-frontend 2>/dev/null || true
              docker rm vegbazar-frontend 2>/dev/null || true
              docker run -d --name vegbazar-frontend --restart unless-stopped -p 80:80 vegbazar-frontend:latest || true
              docker image prune -f
            fi
            sudo systemctl reload nginx 2>/dev/null || true
          EOF
