name: Production CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual "Run workflow" button in GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Test, Lint, Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle (Verification)
        run: npm run build

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (React Code + Dist + Nginx)
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/vegbazar-frontend:latest" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Build Docker Image (Verify PR build)
        if: github.ref != 'refs/heads/main'
        run: docker build -t vegbazar-frontend:ci .

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Pull & Deploy on Production VPS
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    environment:
      name: production
      url: https://vegbazar.pritesh.site

    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pull and Run Container on VPS over SSH
        env:
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USERNAME }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sanitize inputs (strip trailing spaces, newlines, and http(s):// prefixes)
          HOST=$(echo "$RAW_HOST" | tr -d '\r\n\t ' | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||')
          USER=$(echo "$RAW_USER" | tr -d '\r\n\t ')
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/vegbazar-frontend:latest" | tr '[:upper:]' '[:lower:]')

          echo "Deploying $IMAGE_NAME to $USER@$HOST ..."

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash -s << EOF
            set -e

            if command -v docker >/dev/null 2>&1; then
              echo "=== Step 1: Login to GitHub Container Registry ==="
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

              echo "=== Step 2: Pull Latest Frontend Image ==="
              docker pull "$IMAGE_NAME"

              echo "=== Step 3: Run Frontend Container on Port 8085 ==="
              docker stop vegbazar-frontend 2>/dev/null || true
              docker rm vegbazar-frontend 2>/dev/null || true

              PORT=\${FRONTEND_PORT:-8085}
              docker run -d \
                --name vegbazar-frontend \
                --restart unless-stopped \
                -p \${PORT}:80 \
                "$IMAGE_NAME"

              docker image prune -f

              echo "=== Step 4: Verify Container Status ==="
              docker ps --filter "name=vegbazar-frontend"
            else
              echo "ERROR: Docker not installed on server!"
              exit 1
            fi

            sudo systemctl reload nginx 2>/dev/null || true
          EOF
