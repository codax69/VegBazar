name: Production CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual "Run workflow" button in GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Test, Lint & Verify Build
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Test & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle (Verification)
        run: npm run build

      - name: Build Docker Image (Verify build)
        run: docker build -t vegbazar-frontend:ci .

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Production VPS (Git Clone & Build on Server)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    environment:
      name: production
      url: https://vegbazar.pritesh.site

    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Git Pull / Clone & Build on VPS over SSH
        env:
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USERNAME }}
          RAW_TARGET: ${{ secrets.VPS_FRONTEND_TARGET_DIR || secrets.VPS_TARGET_DIR }}
          REPO_URL: "https://github.com/${{ github.repository }}.git"
        run: |
          # Sanitize inputs (strip trailing spaces, newlines, and http(s):// prefixes)
          HOST=$(echo "$RAW_HOST" | tr -d '\r\n\t ' | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||')
          USER=$(echo "$RAW_USER" | tr -d '\r\n\t ')
          TARGET=$(echo "$RAW_TARGET" | tr -d '\r\n\t ')

          echo "Deploying frontend to $USER@$HOST:$TARGET ..."

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash -s << EOF
            set -e

            # Ensure target directory exists
            mkdir -p "$TARGET"
            cd "$TARGET"

            # Step 1: Git Clone or Fetch/Reset on server
            if [ -d ".git" ]; then
              echo "=== Step 1: Fetch & Reset to latest origin/main ==="
              git fetch origin main
              git reset --hard origin/main
            else
              echo "=== Step 1: Clone repository ==="
              git clone "$REPO_URL" .
            fi

            # Step 2: Build Docker Image on Server
            if command -v docker >/dev/null 2>&1; then
              echo "=== Step 2: Build Docker Image on Server ==="
              docker build -t vegbazar-frontend:latest .

              echo "=== Step 3: Run Frontend Container on Port 8085 ==="
              docker stop vegbazar-frontend 2>/dev/null || true
              docker rm vegbazar-frontend 2>/dev/null || true

              PORT=\${FRONTEND_PORT:-8085}
              docker run -d \
                --name vegbazar-frontend \
                --restart unless-stopped \
                -p \${PORT}:80 \
                vegbazar-frontend:latest

              docker image prune -f

              echo "=== Step 4: Verify Container Status ==="
              docker ps --filter "name=vegbazar-frontend"
            else
              echo "ERROR: Docker not installed on server!"
              exit 1
            fi

            sudo systemctl reload nginx 2>/dev/null || true
          EOF
