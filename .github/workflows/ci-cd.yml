name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vegbazar-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, and verify image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify production Docker image
        run: |
          docker build --tag vegbazar-frontend:ci .
          docker run --rm -d --name fe-ci-check -p 8085:80 vegbazar-frontend:ci
          sleep 2
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8085/healthz
          docker kill fe-ci-check

  publish-and-deploy:
    name: Publish and deploy frontend
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    concurrency:
      group: vegbazar-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codax69/vegbazar-frontend:${{ github.sha }}
            ghcr.io/codax69/vegbazar-frontend:latest
          build-args: |
            VITE_RAZORPAY_KEY_ID=${{ vars.VITE_RAZORPAY_KEY_ID }}
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.vegbazar.pritesh.site' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy exact image tag to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" || ! "${VPS_HOST:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_HOST is missing. Add the VPS hostname or IP as a repository secret."
            exit 1
          fi
          if [[ -z "${VPS_USER:-}" || ! "${VPS_USER:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_USER is missing. Add the SSH username as a repository secret (VPS_USERNAME is also accepted for migration)."
            exit 1
          fi
          if [[ -z "${VPS_SSH_KEY:-}" || ! "${VPS_SSH_KEY:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_SSH_KEY is missing. Add the SSH private key as a repository secret."
            exit 1
          fi
          for file in docker-compose.yml deploy.sh; do
            if [ ! -s "$file" ]; then
              echo "::error::Required VPS deployment file is missing from this checkout: $file"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/vegbazar_deploy"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H -T 10 "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Could not obtain VPS host key via ssh-keyscan and VPS_KNOWN_HOSTS is not provided."
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_options=(
            -i "$key_file"
            -p "${VPS_PORT:-22}"
            -o LogLevel=ERROR
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          scp_options=(
            -i "$key_file"
            -P "${VPS_PORT:-22}"
            -o LogLevel=ERROR
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          destination="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$destination" \
            "mkdir -p /opt/apps/vegbazar/frontend 2>/dev/null || true
             if [ ! -w /opt/apps/vegbazar/frontend ]; then
               echo '::error::Permission denied: $VPS_USER cannot write to /opt/apps/vegbazar/frontend. Fix on VPS by running: sudo chown -R $VPS_USER:$VPS_USER /opt/apps/vegbazar' >&2
               exit 1
             fi
             rm -f /opt/apps/vegbazar/frontend/docker-compose.yml /opt/apps/vegbazar/frontend/deploy.sh 2>/dev/null || true"
          scp "${scp_options[@]}" docker-compose.yml deploy.sh \
            "$destination:/opt/apps/vegbazar/frontend/"
          ssh "${ssh_options[@]}" "$destination" \
            "chmod 750 /opt/apps/vegbazar/frontend/deploy.sh && bash /opt/apps/vegbazar/frontend/deploy.sh deploy $GITHUB_SHA"
