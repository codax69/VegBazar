services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in release.env}/vegbazar-frontend:${FRONTEND_IMAGE_TAG:?Set FRONTEND_IMAGE_TAG in release.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777,uid=101,gid=101
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vegbazar

  backend:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in release.env}/vegbazar-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG in release.env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:4041:4000"
    volumes:
      - ./data/invoices:/app/temp
      - ./data/uploads:/app/public/temp
      - ./data/reports:/app/src/temp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vegbazar

networks:
  vegbazar:
    driver: bridge
