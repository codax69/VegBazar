services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-codax69}/vegbazar-frontend:${FRONTEND_IMAGE_TAG:?Set FRONTEND_IMAGE_TAG in release.env}
    container_name: vegbazar-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777,uid=101,gid=101
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
